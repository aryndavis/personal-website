# Pulls new public Substack posts into the education blog once a day and commits them to main,
# so the host redeploys the site. Run it by hand from the Actions tab with "Run workflow".
name: Sync Substack posts

on:
  schedule:
    - cron: '17 13 * * *' # daily, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-substack
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:substack
      - run: npm run sync:substack
      # Only commit a sync that still type-checks and builds.
      - run: npm run build
      - name: Commit changes
        run: |
          git add src/content/education.substack.ts public/images/education/substack
          if git diff --cached --quiet; then
            echo "No new or changed posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync education posts from Substack"
          git push
