# Netlify build settings. Security headers come from public/_headers (copied into dist/).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Every page is prerendered into dist/ (scripts/prerender.mjs), so no rewrite rules are needed.
# Addresses that don't exist get dist/404.html with a 404 status, and the app shows its "not found" page.
